<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enemy Design Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    background: #05060c;
    image-rendering: pixelalpha;
    border: 1px solid #222;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/**
 * preview.html — standalone design sandbox.
 *
 * Self-contained scratch space for previewing new enemy hulls / animations
 * before wiring them into the real entity classes. Mirrors the subset of
 * Renderer.js's primitive API (strokePaths, fillStrokePaths, fillEllipse,
 * strokeCircle, drawFlame, drawText) so sketches here can be ported into
 * real entity render() methods with minimal changes. Not part of the game —
 * delete or ignore once the design under test has been integrated.
 */

const VW = 540, VH = 960; // same virtual resolution as the game

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssH = Math.min(window.innerHeight - 20, 900);
  const cssW = cssH * (VW / VH);
  canvas.style.width  = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const scale = (cssW * dpr) / VW;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Player marker — drag/move to test the alien's "fire toward player" aim ──
const PLAYER_COLOR = '#00E5FF';
let playerX = VW / 2;
let playerY = VH * 0.82;

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  playerX = (e.clientX - rect.left) / rect.width  * VW;
  playerY = (e.clientY - rect.top)  / rect.height * VH;
});

// ── Renderer-equivalent primitives ──────────────────────────────────────────

function clear(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, VW, VH);
}

function strokePaths(paths, { x = 0, y = 0, scale = 1, rotation = 0, alpha = 1, color, lineWidth, glowColor, glowBlur = 0, lineCap = 'butt', singleStroke = false }, count = paths.length) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (scale !== 1) ctx.scale(scale, scale);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = scale !== 1 ? lineWidth / scale : lineWidth;
  if (lineCap !== 'butt') ctx.lineCap = lineCap;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }

  if (singleStroke) {
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const pts = paths[i].points;
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      if (paths[i].closed !== false) ctx.closePath();
    }
    ctx.stroke();
  } else {
    for (let i = 0; i < count; i++) {
      const pts = paths[i].points;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      if (paths[i].closed !== false) ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();
}

function fillStrokePaths(paths, { x = 0, y = 0, rotation = 0, alpha = 1, fillColor, strokeColor, lineWidth, glowColor, glowBlur = 0 }, count = paths.length) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = fillColor;
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = lineWidth;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? strokeColor; ctx.shadowBlur = glowBlur; }
  for (let i = 0; i < count; i++) {
    const pts = paths[i].points;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    if (paths[i].closed !== false) ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function fillEllipse(localCx, localCy, rx, ry, { x = 0, y = 0, rotation = 0, fillColor, alpha = 1 }) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = fillColor;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.ellipse(localCx, localCy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function strokeCircle(x, y, radius, { color, lineWidth, glowBlur = 0, glowColor, alpha = 1 }) {
  if (radius <= 0) return;
  ctx.save();
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawFlame(localBaseX, localBaseY, length, { x = 0, y = 0, rotation = 0, halfWidth = 4, color, alpha = 1 }) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  const h = color.replace('#', '');
  const rgba = `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},0.70)`;
  ctx.fillStyle = rgba;
  const tipY = localBaseY - length;
  ctx.beginPath();
  ctx.moveTo(localBaseX - halfWidth, localBaseY);
  ctx.lineTo(localBaseX + halfWidth, localBaseY);
  ctx.lineTo(localBaseX, tipY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawText(text, x, y, { font, color, align = 'center', baseline = 'middle', alpha = 1, glowBlur = 0, glowColor }) {
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (alpha < 1) ctx.globalAlpha = alpha;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ── Scene under test ─────────────────────────────────────────────────────────
// "Drifter" — a non-firing, non-tracking alien saucer that flies a fixed path
// and exits off-screen. Spawned as a conga-line of clones that follow the
// exact same path, trailing behind the leader by a fixed distance.
//
// Path: diagonal entry from a random top corner -> one full loop-the-loop
// partway down the diagonal -> continue in the same diagonal direction to
// the opposite bottom corner and beyond.

const ALIEN_COLOR = '#FFB020';
const ALIEN_FILL  = '#1a1000';
const ALIEN_DOME  = '#FFE0A0';
const ALIEN_PALETTE = { color: ALIEN_COLOR, fillColor: ALIEN_FILL, domeColor: ALIEN_DOME };

// Bell-shaped head — rounded dome on top, flatter base where tentacles attach.
// Local space, roughly 22 across, 22 tall.
const BODY_PTS = [
  [-11,-2],[-9,-8],[-3,-12],[3,-12],[9,-8],[11,-2],
  [10,4],[6,8],[0,10],[-6,8],[-10,4],
];

// Eye sockets (local space) — pulse independently per clone.
const EYES = [[-4,-2],[4,-2]];

// Tentacle base attachment points along the bottom rim, local space.
// Local +y = trailing edge (behind direction of travel — see samplePath heading convention).
const TENTACLE_BASES = [[-7,7],[-2.5,9],[2.5,9],[7,7]];
const TENTACLE_LEN   = 20;
const TENTACLE_SEGS  = 4;
const TENTACLE_AMP   = 6;
const TENTACLE_SPEED = 5;

const NUM_CLONES = 5;
const SPACING    = 50;   // distance along path between trailing clones, virtual px
const SPEED      = 220;  // virtual px/sec along the path
const LOOP_R     = 70;   // loop-the-loop radius
const ENTRY_MARGIN = 60;

// ── Variety #2 — "Sweeper" row ──────────────────────────────────────────────
// A single conga-line of 15 clones, all spawning at the same time.
// The row travels in a straight horizontal line, then steps straight down
// by ROW_STEP when it hits a screen edge and reverses direction — no
// diagonal motion, just a horizontal lane stepping down repeatedly. While
// moving horizontally the body faces that direction (head leads, tentacles
// trail behind); during the downward step it faces straight down (head
// toward the player, tentacles on top). Starts at the left edge moving
// right. Reuses scout's magenta palette.
const ROW_COUNT       = 1;
const CLONES_PER_ROW  = 12;
const ROW_SPACING     = 50;   // distance along the path between trailing clones
const ROW_SPEED       = 220;  // virtual px/sec along the path
const ROW_MARGIN      = 50;   // horizontal bounds the row sweeps between
const ROW_STEP        = 40;   // vertical drop performed at each bounce
const ROW_START_Y     = [60]; // starting height per row
const ROW_DIR         = [1];  // +1 = start left edge moving right, -1 = start right edge moving left

const SWEEPER_COLOR = '#ff3ec9';
const SWEEPER_FILL  = '#1a0a20';
const SWEEPER_DOME  = '#ffd0ee';
// Slightly longer fire intervals than variety #1 — with 15 clones on
// screen at once, firing at the same rate would feel overwhelming.
const SWEEPER_FIRE_INTERVAL_MULT = 1.4;
const SWEEPER_PALETTE = { color: SWEEPER_COLOR, fillColor: SWEEPER_FILL, domeColor: SWEEPER_DOME, fireIntervalMult: SWEEPER_FIRE_INTERVAL_MULT };

// ── Variety #3 — "Diver" ─────────────────────────────────────────────────────
// A small V-shaped wedge (5 clones) that drops straight down, accelerating as
// it falls — reads as an aggressive, fast "incoming" pack rather than a
// grazing formation. Always faces straight down (head toward the player,
// tentacles trailing above), same as the sweeper's vertical-step pose.
// Neon green — distinct from amber (#1) and magenta (#2).
const DIVER_COLOR = '#39ff14';
const DIVER_FILL  = '#06190a';
const DIVER_DOME  = '#c8ffb0';
const DIVER_PALETTE = { color: DIVER_COLOR, fillColor: DIVER_FILL, domeColor: DIVER_DOME, fireIntervalMult: 1 };
// Offsets from the wedge's leader (tip), local to the formation — a V
// pointing in the direction of travel (down).
const DIVER_OFFSETS = [[0,0], [-35,-35], [35,-35], [-70,-70], [70,-70]];
const DIVER_START_SPEED = 140;  // vp/sec at spawn
const DIVER_ACCEL       = 90;   // vp/sec^2 — speeds up as it falls
const DIVER_MARGIN      = 80;   // horizontal spawn bounds

// ── Variety #4 — "Weaver" ────────────────────────────────────────────────────
// A single conga-line of 6 clones descending in a continuous sine-wave path —
// reads as an erratic, hard-to-predict drift compared to #1's smooth loop and
// #2's straight rows. Cyan-blue — distinct from the other three.
const WEAVER_COLOR = '#39c5ff';
const WEAVER_FILL  = '#001824';
const WEAVER_DOME  = '#b0eaff';
const WEAVER_PALETTE = { color: WEAVER_COLOR, fillColor: WEAVER_FILL, domeColor: WEAVER_DOME, fireIntervalMult: 1 };
const WEAVER_COUNT   = 6;
const WEAVER_SPACING = 50;     // distance along path between trailing clones
const WEAVER_SPEED   = 200;    // vp/sec along the path
const WEAVER_AMP     = 90;     // horizontal sway amplitude, vp
const WEAVER_FREQ    = 0.012;  // radians per vp traveled — wave tightness

// ── Variety #5 — "Orbiter" ───────────────────────────────────────────────────
// A trio that flies in from the top, settles into the upper third, circles a
// fixed point for a few seconds (a lingering threat rather than a pass-through
// formation), then breaks off straight down and exits. Gold — distinct from
// the other three.
const ORBITER_COLOR = '#ffe14d';
const ORBITER_FILL  = '#1a1500';
const ORBITER_DOME  = '#fff8c0';
const ORBITER_PALETTE = { color: ORBITER_COLOR, fillColor: ORBITER_FILL, domeColor: ORBITER_DOME, fireIntervalMult: 1 };
const ORBIT_COUNT       = 3;
const ORBIT_RADIUS      = 60;   // vp
const ORBIT_ANGSPEED    = 1.5;  // rad/sec
const ORBIT_CENTER      = { x: VW / 2, y: VH * 0.28 };
const ORBIT_ENTER_SPEED = 220;  // vp/sec while flying in
const ORBIT_EXIT_SPEED  = 260;  // vp/sec while flying out
const ORBIT_DURATION    = 4;    // seconds spent orbiting before breaking off

// ── Tentacle-lash AOE attack ────────────────────────────────────────────────
const FIRE_MIN_INTERVAL = 2.5; // seconds idle before the next lash
const FIRE_MAX_INTERVAL = 5.0;
const LASH_DURATION  = 0.22;   // tentacle whips outward
const LASH_LEN       = TENTACLE_LEN * 2.0;
const BURST_DURATION = 0.35;   // AOE scatter at the impact point
const BURST_MAX_R    = 30;
const SPARK_ANGLES   = [0, Math.PI/3, 2*Math.PI/3, Math.PI, 4*Math.PI/3, 5*Math.PI/3];
const PROJECTILE_SPEED  = 320; // virtual px/sec
const PROJECTILE_RADIUS = 4;

const randInterval = (mult = 1) => (FIRE_MIN_INTERVAL + Math.random() * (FIRE_MAX_INTERVAL - FIRE_MIN_INTERVAL)) * mult;

// Per-clone fire state — persists across frames (and across path respawns).
// Sized for the larger of the two varieties (18 clones for variety #2).
const cloneStates = Array.from({ length: 18 }, () => ({
  timer: randInterval(), state: 'idle', age: 0, tentacleIdx: 0,
}));

// Press 1-5 to switch between variety previews.
let variety = 2;
window.addEventListener('keydown', (e) => {
  if (e.key === '1') variety = 1;
  if (e.key === '2') variety = 2;
  if (e.key === '3') variety = 3;
  if (e.key === '4') variety = 4;
  if (e.key === '5') variety = 5;
});

let age = 0;
let u   = 0;     // leader's distance traveled along the current path
let path = null; // current path definition, regenerated on respawn

function makePath() {
  const fromLeft = Math.random() < 0.5;
  const dir = fromLeft ? { x: 1 / Math.SQRT2, y: 1 / Math.SQRT2 }
                        : { x: -1 / Math.SQRT2, y: 1 / Math.SQRT2 };
  const entry = fromLeft
    ? { x: -ENTRY_MARGIN, y: -ENTRY_MARGIN }
    : { x: VW + ENTRY_MARGIN, y: -ENTRY_MARGIN };

  const L1 = 250 + Math.random() * 150; // straight run before the loop
  const P1 = { x: entry.x + dir.x * L1, y: entry.y + dir.y * L1 };

  // Loop center: 90° left of travel direction, tangent-continuous at P1.
  const perp  = { x: -dir.y, y: dir.x };
  const C     = { x: P1.x + perp.x * LOOP_R, y: P1.y + perp.y * LOOP_R };
  const theta0 = Math.atan2(-dir.x, dir.y);
  const Lloop  = 2 * Math.PI * LOOP_R;

  const L3 = 900; // straight run after the loop, well past the far corner

  return { dir, entry, L1, P1, C, theta0, Lloop, L3, total: L1 + Lloop + L3 };
}

/** Position + heading at distance `dist` along the given path. */
function samplePath(p, dist) {
  if (dist < p.L1) {
    return {
      x: p.entry.x + p.dir.x * dist, y: p.entry.y + p.dir.y * dist,
      heading: Math.atan2(p.dir.x, -p.dir.y),
    };
  }
  if (dist < p.L1 + p.Lloop) {
    const theta = p.theta0 + (dist - p.L1) / LOOP_R;
    const tx = -Math.sin(theta), ty = Math.cos(theta);
    return {
      x: p.C.x + Math.cos(theta) * LOOP_R, y: p.C.y + Math.sin(theta) * LOOP_R,
      heading: Math.atan2(tx, -ty),
    };
  }
  const dd = dist - p.L1 - p.Lloop;
  return {
    x: p.P1.x + p.dir.x * dd, y: p.P1.y + p.dir.y * dd,
    heading: Math.atan2(p.dir.x, -p.dir.y),
  };
}

/**
 * Runs the fire-state machine and draws tentacles + body + eyes for one
 * clone at the given world position/heading. Shared by both varieties so
 * the attack/visuals stay identical regardless of path shape.
 */
function updateAndRenderClone(dt, i, x, y, heading, cs, palette) {
    const c = Math.cos(heading), s = Math.sin(heading);

    // Off-screen — cancel any in-progress attack and skip entirely so it
    // can't keep firing/bursting while invisible.
    const margin = 40;
    if (x < -margin || x > VW + margin || y < -margin || y > VH + margin) {
      if (cs.state !== 'idle') { cs.state = 'idle'; cs.timer = randInterval(palette.fireIntervalMult); }
      return;
    }

    // ── Tentacle-lash AOE attack — fire state machine ─────────────────────────
    if (cs.state === 'idle') {
      cs.timer -= dt;
      if (cs.timer <= 0) {
        cs.state = 'lashing';
        cs.age   = 0;
        cs.tentacleIdx = Math.floor(Math.random() * TENTACLE_BASES.length);

        // Lock the target to the player's current position at the moment of
        // firing, and aim the lash toward it (converted to local space so it
        // rotates with the ship).
        const [lbx, lby] = TENTACLE_BASES[cs.tentacleIdx];
        const baseX = x + c * lbx - s * lby;
        const baseY = y + s * lbx + c * lby;
        cs.targetX   = playerX;
        cs.targetY   = playerY;
        cs.lashAngle = Math.atan2(cs.targetY - baseY, cs.targetX - baseX) - heading;
      }
    } else if (cs.state === 'lashing') {
      cs.age += dt;
      if (cs.age >= LASH_DURATION) {
        // Launch a projectile from the tentacle's extended tip toward the
        // locked target — this is what actually crosses the screen.
        const [lbx, lby] = TENTACLE_BASES[cs.tentacleIdx];
        const dirX  = Math.cos(cs.lashAngle), dirY = Math.sin(cs.lashAngle);
        const tipLX = lbx + dirX * LASH_LEN, tipLY = lby + dirY * LASH_LEN;
        cs.projX = x + c * tipLX - s * tipLY;
        cs.projY = y + s * tipLX + c * tipLY;
        const ddx = cs.targetX - cs.projX, ddy = cs.targetY - cs.projY;
        const dist = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
        cs.projVX = ddx / dist * PROJECTILE_SPEED;
        cs.projVY = ddy / dist * PROJECTILE_SPEED;
        cs.state = 'spitting';
        cs.age = 0;
      }
    } else if (cs.state === 'spitting') {
      cs.age += dt;
      const ddx = cs.targetX - cs.projX, ddy = cs.targetY - cs.projY;
      const remaining = Math.sqrt(ddx * ddx + ddy * ddy);
      const step = PROJECTILE_SPEED * dt;
      if (remaining <= step) {
        cs.projX = cs.targetX; cs.projY = cs.targetY;
        cs.state = 'bursting'; cs.age = 0;
      } else {
        cs.projX += cs.projVX * dt;
        cs.projY += cs.projVY * dt;
      }
    } else if (cs.state === 'bursting') {
      cs.age += dt;
      if (cs.age >= BURST_DURATION) { cs.state = 'idle'; cs.age = 0; cs.timer = randInterval(palette.fireIntervalMult); }
    }

    // Tentacles — drawn first so they trail out from behind the body.
    for (let j = 0; j < TENTACLE_BASES.length; j++) {
      const [bx, by] = TENTACLE_BASES[j];
      const isLashTentacle = j === cs.tentacleIdx && cs.state === 'lashing';

      let len = TENTACLE_LEN;
      let amp = TENTACLE_AMP;
      if (isLashTentacle) {
        const t = cs.age / LASH_DURATION;
        len = TENTACLE_LEN + (LASH_LEN - TENTACLE_LEN) * t; // whip outward
        amp = TENTACLE_AMP * (1 - t * 0.7);                 // straightens as it extends
      }

      // Normal tentacles trail straight behind (local +y); a lashing tentacle
      // points toward the player along the angle locked in at fire time.
      const dirAngle = isLashTentacle ? cs.lashAngle : Math.PI / 2;
      const dirX = Math.cos(dirAngle), dirY = Math.sin(dirAngle);
      const perpX = -dirY, perpY = dirX;

      const pts = [[bx, by]];
      for (let k = 1; k <= TENTACLE_SEGS; k++) {
        const t    = k / TENTACLE_SEGS;
        const wave = Math.sin(age * TENTACLE_SPEED + i * 0.7 + j * 1.3 + t * 3) * (amp * t);
        const wx   = bx + dirX * len * t + perpX * wave;
        const wy   = by + dirY * len * t + perpY * wave;
        pts.push([wx, wy]);
      }
      strokePaths([{ points: pts, closed: false }], {
        x, y, rotation: heading,
        color: palette.color, lineWidth: isLashTentacle ? 3 : 2.2, lineCap: 'round',
        glowBlur: isLashTentacle ? 10 : 6, glowColor: palette.color, alpha: 0.85,
      });
    }

    // Projectile — travels from the alien toward the locked target position.
    if (cs.state === 'spitting') {
      strokeCircle(cs.projX, cs.projY, PROJECTILE_RADIUS, {
        color: palette.color, lineWidth: 2,
        glowBlur: 8, glowColor: palette.color, alpha: 1,
      });
    }

    // AOE scatter burst at the impact point (the locked target position).
    if (cs.state === 'bursting') {
      const bt = cs.age / BURST_DURATION;
      strokeCircle(cs.targetX, cs.targetY, bt * BURST_MAX_R, {
        color: palette.color, lineWidth: 2, alpha: 1 - bt,
      });
      for (const ang of SPARK_ANGLES) {
        const r2 = bt * BURST_MAX_R * 0.8;
        strokePaths([{ points: [[cs.targetX, cs.targetY], [cs.targetX + Math.cos(ang) * r2, cs.targetY + Math.sin(ang) * r2]], closed: false }], {
          color: palette.color, lineWidth: 2, lineCap: 'round',
          glowBlur: 4, glowColor: palette.color, alpha: 1 - bt,
        });
      }
    }

    // Body — bell-shaped head
    fillStrokePaths([{ points: BODY_PTS, closed: true }], {
      x, y, rotation: heading,
      fillColor: palette.fillColor, strokeColor: palette.color,
      lineWidth: 1.8, glowBlur: 8, glowColor: palette.color,
    });

    // Pulsing eyes
    for (let j = 0; j < EYES.length; j++) {
      const [lx, ly] = EYES[j];
      const wx = x + c * lx - s * ly;
      const wy = y + s * lx + c * ly;
      const pulse = 0.5 + 0.5 * Math.abs(Math.sin(age * 3 + i * 0.6 + j * 1.5));
      strokeCircle(wx, wy, 1.8, {
        color: palette.domeColor, lineWidth: 2.5,
        glowBlur: 6, glowColor: palette.domeColor,
        alpha: pulse,
      });
    }
}

/** Variety #1 — diagonal entry, loop-the-loop, diagonal exit. */
function renderVariety1(dt) {
  if (!path) path = makePath();

  u += SPEED * dt;
  if (u - (NUM_CLONES - 1) * SPACING > path.total) {
    path = makePath();
    u = 0;
  }

  for (let i = 0; i < NUM_CLONES; i++) {
    const dist = u - i * SPACING;
    if (dist < 0 || dist > path.total) continue;

    const { x, y, heading } = samplePath(path, dist);
    updateAndRenderClone(dt, i, x, y, heading, cloneStates[i], ALIEN_PALETTE);
  }
}

// Each row's distance traveled along its own straight-line/step path.
const rowU = [0, 0, 0];

/**
 * Position + heading at distance `u` along a row's path: straight
 * horizontal runs of length `range` (facing the direction of travel),
 * each followed by a straight vertical drop of ROW_STEP (facing straight
 * down), alternating left/right after every drop.
 */
function sweeperPos(u, r) {
  const range    = VW - 2 * ROW_MARGIN;
  const cycleLen = range + ROW_STEP;

  const cyc = Math.floor(u / cycleLen);
  const uic = u - cyc * cycleLen;

  const dir      = ROW_DIR[r] * (cyc % 2 === 0 ? 1 : -1);
  const startX   = dir > 0 ? ROW_MARGIN : VW - ROW_MARGIN;
  const rowYBase = ROW_START_Y[r] + cyc * ROW_STEP;

  if (uic < range) {
    // Horizontal run — head leads in the direction of travel.
    return { x: startX + dir * uic, y: rowYBase, heading: dir > 0 ? Math.PI / 2 : -Math.PI / 2 };
  }
  // Vertical drop — head points straight down, tentacles trail above.
  return { x: startX + dir * range, y: rowYBase + (uic - range), heading: Math.PI };
}

/** Variety #2 — 3 rows of 6, all spawning together, stepping downward. */
function renderVariety2(dt) {
  for (let r = 0; r < ROW_COUNT; r++) {
    rowU[r] += ROW_SPEED * dt;

    for (let i = 0; i < CLONES_PER_ROW; i++) {
      const uClone = rowU[r] - i * ROW_SPACING;
      if (uClone < 0) continue; // not yet entered

      const { x, y, heading } = sweeperPos(uClone, r);
      if (y > VH + 40) continue; // already exited off the bottom

      const idx = r * CLONES_PER_ROW + i;
      updateAndRenderClone(dt, idx, x, y, heading, cloneStates[idx], SWEEPER_PALETTE);
    }

    // Once the trailing clone has exited off the bottom, restart the row.
    if (sweeperPos(rowU[r] - (CLONES_PER_ROW - 1) * ROW_SPACING, r).y > VH + 40) {
      rowU[r] = 0;
    }
  }
}

// ── Variety #3 — "Diver" wedge ───────────────────────────────────────────────
let diverX = VW / 2, diverY = -70, diverSpeed = DIVER_START_SPEED;

function renderVariety3(dt) {
  diverSpeed += DIVER_ACCEL * dt;
  diverY += diverSpeed * dt;

  for (let i = 0; i < DIVER_OFFSETS.length; i++) {
    const [ox, oy] = DIVER_OFFSETS[i];
    const x = diverX + ox, y = diverY + oy;
    if (y < -40 || y > VH + 40) continue;
    updateAndRenderClone(dt, i, x, y, Math.PI, cloneStates[i], DIVER_PALETTE);
  }

  // Respawn once the trailing (topmost) clone clears the bottom edge.
  const trailingY = diverY + DIVER_OFFSETS[DIVER_OFFSETS.length - 1][1];
  if (trailingY > VH + 40) {
    diverY = -70;
    diverSpeed = DIVER_START_SPEED;
    diverX = DIVER_MARGIN + Math.random() * (VW - 2 * DIVER_MARGIN);
  }
}

// ── Variety #4 — "Weaver" sine-wave conga line ──────────────────────────────
let weaverU = 0;
const WEAVER_BASE_X = VW / 2;

/** Position + heading at distance `dist` traveled along the sine path. */
function weaverPos(dist) {
  const y = -60 + dist;
  const x = WEAVER_BASE_X + Math.sin(dist * WEAVER_FREQ) * WEAVER_AMP;

  // Tangent direction of travel: (dx/dd, dy/dd), normalized.
  const dx = WEAVER_AMP * WEAVER_FREQ * Math.cos(dist * WEAVER_FREQ);
  const dy = 1;
  const len = Math.sqrt(dx * dx + dy * dy);
  return { x, y, heading: Math.atan2(dx / len, -dy / len) };
}

function renderVariety4(dt) {
  weaverU += WEAVER_SPEED * dt;

  for (let i = 0; i < WEAVER_COUNT; i++) {
    const dist = weaverU - i * WEAVER_SPACING;
    if (dist < 0) continue;
    const { x, y, heading } = weaverPos(dist);
    if (y > VH + 40) continue;
    updateAndRenderClone(dt, i, x, y, heading, cloneStates[i], WEAVER_PALETTE);
  }

  // Respawn once the trailing clone clears the bottom edge.
  const tailDist = weaverU - (WEAVER_COUNT - 1) * WEAVER_SPACING;
  if (tailDist >= 0 && weaverPos(tailDist).y > VH + 40) {
    weaverU = 0;
  }
}

// ── Variety #5 — "Orbiter" lingering trio ───────────────────────────────────
let orbiterState = 'entering'; // 'entering' | 'orbiting' | 'exiting'
let orbiterX = ORBIT_CENTER.x, orbiterY = -60;
let orbiterAngle = 0;
let orbiterTimer = 0;

function orbiterOffset(i, angleBase) {
  const a = angleBase + i * (2 * Math.PI / ORBIT_COUNT);
  return { dx: Math.cos(a) * ORBIT_RADIUS, dy: Math.sin(a) * ORBIT_RADIUS };
}

function renderVariety5(dt) {
  if (orbiterState === 'entering') {
    orbiterY += ORBIT_ENTER_SPEED * dt;
    if (orbiterY >= ORBIT_CENTER.y) {
      orbiterY = ORBIT_CENTER.y;
      orbiterState = 'orbiting';
      orbiterTimer = 0;
    }
  } else if (orbiterState === 'orbiting') {
    orbiterAngle += ORBIT_ANGSPEED * dt;
    orbiterTimer += dt;
    if (orbiterTimer >= ORBIT_DURATION) orbiterState = 'exiting';
  } else { // exiting
    orbiterY += ORBIT_EXIT_SPEED * dt;
    if (orbiterY - ORBIT_RADIUS > VH + 40) {
      orbiterState = 'entering';
      orbiterX = ORBIT_CENTER.x;
      orbiterY = -60;
      orbiterAngle = 0;
    }
  }

  for (let i = 0; i < ORBIT_COUNT; i++) {
    const { dx, dy } = orbiterOffset(i, orbiterAngle);
    const x = orbiterX + dx, y = orbiterY + dy;
    // Tangent-to-circle heading while orbiting; straight down otherwise.
    const heading = orbiterState === 'orbiting'
      ? orbiterAngle + i * (2 * Math.PI / ORBIT_COUNT) + Math.PI / 2
      : Math.PI;
    updateAndRenderClone(dt, i, x, y, heading, cloneStates[i], ORBITER_PALETTE);
  }
}

const VARIETY_NAMES = { 1: 'Looper', 2: 'Sweeper', 3: 'Diver', 4: 'Weaver', 5: 'Orbiter' };

function render(dt) {
  age += dt;
  clear('#05060c');

  if      (variety === 1) renderVariety1(dt);
  else if (variety === 2) renderVariety2(dt);
  else if (variety === 3) renderVariety3(dt);
  else if (variety === 4) renderVariety4(dt);
  else                     renderVariety5(dt);

  // Player marker — move the pointer over the canvas to reposition it.
  fillStrokePaths([{ points: [[0,-10],[8,8],[0,4],[-8,8]], closed: true }], {
    x: playerX, y: playerY,
    fillColor: '#003a40', strokeColor: PLAYER_COLOR,
    lineWidth: 1.8, glowBlur: 8, glowColor: PLAYER_COLOR,
  });

  // Variety indicator
  drawText(`Variety #${variety} — ${VARIETY_NAMES[variety]}  (press 1-5)`, VW / 2, 24, {
    font: '16px sans-serif', color: '#888',
  });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
