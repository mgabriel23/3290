<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enemy Design Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    background: #05060c;
    image-rendering: pixelalpha;
    border: 1px solid #222;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/**
 * preview.html — standalone design sandbox.
 *
 * Self-contained scratch space for previewing new enemy hulls / animations
 * before wiring them into the real entity classes. Mirrors the subset of
 * Renderer.js's primitive API (strokePaths, fillStrokePaths, fillEllipse,
 * strokeCircle, drawFlame, drawText) so sketches here can be ported into
 * real entity render() methods with minimal changes. Not part of the game —
 * delete or ignore once the design under test has been integrated.
 */

const VW = 540, VH = 960; // same virtual resolution as the game

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssH = Math.min(window.innerHeight - 20, 900);
  const cssW = cssH * (VW / VH);
  canvas.style.width  = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const scale = (cssW * dpr) / VW;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Player marker — drag/move to test the alien's "fire toward player" aim ──
const PLAYER_COLOR = '#00E5FF';
let playerX = VW / 2;
let playerY = VH * 0.82;

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  playerX = (e.clientX - rect.left) / rect.width  * VW;
  playerY = (e.clientY - rect.top)  / rect.height * VH;
});

// ── Renderer-equivalent primitives ──────────────────────────────────────────

function clear(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, VW, VH);
}

function strokePaths(paths, { x = 0, y = 0, scale = 1, rotation = 0, alpha = 1, color, lineWidth, glowColor, glowBlur = 0, lineCap = 'butt', singleStroke = false }, count = paths.length) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (scale !== 1) ctx.scale(scale, scale);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = scale !== 1 ? lineWidth / scale : lineWidth;
  if (lineCap !== 'butt') ctx.lineCap = lineCap;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }

  if (singleStroke) {
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const pts = paths[i].points;
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      if (paths[i].closed !== false) ctx.closePath();
    }
    ctx.stroke();
  } else {
    for (let i = 0; i < count; i++) {
      const pts = paths[i].points;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      if (paths[i].closed !== false) ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();
}

function fillStrokePaths(paths, { x = 0, y = 0, rotation = 0, alpha = 1, fillColor, strokeColor, lineWidth, glowColor, glowBlur = 0 }, count = paths.length) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = fillColor;
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = lineWidth;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? strokeColor; ctx.shadowBlur = glowBlur; }
  for (let i = 0; i < count; i++) {
    const pts = paths[i].points;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    if (paths[i].closed !== false) ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function fillEllipse(localCx, localCy, rx, ry, { x = 0, y = 0, rotation = 0, fillColor, alpha = 1 }) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = fillColor;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.ellipse(localCx, localCy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function strokeCircle(x, y, radius, { color, lineWidth, glowBlur = 0, glowColor, alpha = 1 }) {
  if (radius <= 0) return;
  ctx.save();
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawFlame(localBaseX, localBaseY, length, { x = 0, y = 0, rotation = 0, halfWidth = 4, color, alpha = 1 }) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  const h = color.replace('#', '');
  const rgba = `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},0.70)`;
  ctx.fillStyle = rgba;
  const tipY = localBaseY - length;
  ctx.beginPath();
  ctx.moveTo(localBaseX - halfWidth, localBaseY);
  ctx.lineTo(localBaseX + halfWidth, localBaseY);
  ctx.lineTo(localBaseX, tipY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawText(text, x, y, { font, color, align = 'center', baseline = 'middle', alpha = 1, glowBlur = 0, glowColor }) {
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (alpha < 1) ctx.globalAlpha = alpha;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ── Scene under test ─────────────────────────────────────────────────────────
// Empty slate — the next enemy's design goes here.

let age = 0;

function render(dt) {
  age += dt;
  clear('#05060c');

  // Player marker — move the pointer over the canvas to reposition it.
  fillStrokePaths([{ points: [[0,-10],[8,8],[0,4],[-8,8]], closed: true }], {
    x: playerX, y: playerY,
    fillColor: '#003a40', strokeColor: PLAYER_COLOR,
    lineWidth: 1.8, glowBlur: 8, glowColor: PLAYER_COLOR,
  });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
