<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enemy Design Preview</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    background: #05060c;
    image-rendering: pixelalpha;
    border: 1px solid #222;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/**
 * preview.html — standalone design sandbox.
 *
 * Self-contained scratch space for previewing new enemy hulls / animations
 * before wiring them into the real entity classes. Mirrors the subset of
 * Renderer.js's primitive API (strokePaths, fillStrokePaths, fillEllipse,
 * strokeCircle, drawFlame, drawText) so sketches here can be ported into
 * real entity render() methods with minimal changes. Not part of the game —
 * delete or ignore once the design under test has been integrated.
 */

const VW = 540, VH = 960; // same virtual resolution as the game

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssH = Math.min(window.innerHeight - 20, 900);
  const cssW = cssH * (VW / VH);
  canvas.style.width  = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const scale = (cssW * dpr) / VW;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Player marker — drag/move to test the alien's "fire toward player" aim ──
const PLAYER_COLOR = '#00E5FF';
let playerX = VW / 2;
let playerY = VH * 0.82;

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  playerX = (e.clientX - rect.left) / rect.width  * VW;
  playerY = (e.clientY - rect.top)  / rect.height * VH;
});

// ── Renderer-equivalent primitives ──────────────────────────────────────────

function clear(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, VW, VH);
}

function strokePaths(paths, { x = 0, y = 0, scale = 1, rotation = 0, alpha = 1, color, lineWidth, glowColor, glowBlur = 0, lineCap = 'butt', singleStroke = false }, count = paths.length) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (scale !== 1) ctx.scale(scale, scale);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = scale !== 1 ? lineWidth / scale : lineWidth;
  if (lineCap !== 'butt') ctx.lineCap = lineCap;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }

  if (singleStroke) {
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const pts = paths[i].points;
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      if (paths[i].closed !== false) ctx.closePath();
    }
    ctx.stroke();
  } else {
    for (let i = 0; i < count; i++) {
      const pts = paths[i].points;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      if (paths[i].closed !== false) ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();
}

function fillStrokePaths(paths, { x = 0, y = 0, rotation = 0, alpha = 1, fillColor, strokeColor, lineWidth, glowColor, glowBlur = 0 }, count = paths.length) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = fillColor;
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = lineWidth;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? strokeColor; ctx.shadowBlur = glowBlur; }
  for (let i = 0; i < count; i++) {
    const pts = paths[i].points;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    if (paths[i].closed !== false) ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function fillEllipse(localCx, localCy, rx, ry, { x = 0, y = 0, rotation = 0, fillColor, alpha = 1 }) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.fillStyle = fillColor;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.ellipse(localCx, localCy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function strokeCircle(x, y, radius, { color, lineWidth, glowBlur = 0, glowColor, alpha = 1 }) {
  if (radius <= 0) return;
  ctx.save();
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawFlame(localBaseX, localBaseY, length, { x = 0, y = 0, rotation = 0, halfWidth = 4, color, alpha = 1 }) {
  ctx.save();
  ctx.translate(x, y);
  if (rotation !== 0) ctx.rotate(rotation);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  const h = color.replace('#', '');
  const rgba = `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},0.70)`;
  ctx.fillStyle = rgba;
  const tipY = localBaseY - length;
  ctx.beginPath();
  ctx.moveTo(localBaseX - halfWidth, localBaseY);
  ctx.lineTo(localBaseX + halfWidth, localBaseY);
  ctx.lineTo(localBaseX, tipY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawText(text, x, y, { font, color, align = 'center', baseline = 'middle', alpha = 1, glowBlur = 0, glowColor }) {
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (alpha < 1) ctx.globalAlpha = alpha;
  if (glowBlur > 0) { ctx.shadowColor = glowColor ?? color; ctx.shadowBlur = glowBlur; }
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ── Scene under test ─────────────────────────────────────────────────────────
// Bouncer variety #3 candidates — press 2 / 5 to switch:
//   2: "Phaser"   — cycles between solid and intangible (flickering/dim) states
//   5: "Shielded" — outer rotating shield ring absorbs hits before the core
//                   takes damage; click/tap the shape to fire a test "bullet"
const AMBER   = '#FFB020';
const SHIELD_COLOR = '#6FE0FF';
const HEALTH_FONT = '400 16px "Audiowide", "Courier New", monospace';
const LABEL_FONT  = '400 14px "Audiowide", "Courier New", monospace';
const GRAVITY = 300, SPIN_FACTOR = 0.04;
const FLOOR_Y = VH - 80; // stand-in for the Barrier's surface

function hexPoints(radius) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    pts.push([Math.cos(a) * radius, Math.sin(a) * radius]);
  }
  return pts;
}

function worldHull(localPts, x, y, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return localPts.map(([lx, ly]) => [x + c * lx - s * ly, y + s * lx + c * ly]);
}

function bouncePhysics(body, dt, radius) {
  body.angle += body.vx * SPIN_FACTOR * dt;
  body.vy += GRAVITY * dt;
  body.x  += body.vx * dt;
  body.y  += body.vy * dt;
  if (body.x <= radius) { body.x = radius; body.vx = Math.abs(body.vx); }
  else if (body.x >= VW - radius) { body.x = VW - radius; body.vx = -Math.abs(body.vx); }
  if (body.y <= radius && body.vy < 0) { body.y = radius; body.vy = Math.abs(body.vy); }
  if (body.y + radius >= FLOOR_Y && body.vy > 0) { body.y = FLOOR_Y - radius; body.vy = -Math.abs(body.vy); }
}

// ── #2 "Phaser" ──────────────────────────────────────────────────────────────
// Cycles between a solid (hittable) phase and an intangible "phased" phase
// (dim, flickering, no glow). While phased it would pass through both bullets
// and the barrier untouched.
class PhaserPreview {
  constructor() {
    this.x = VW / 2; this.y = 200;
    this.vx = 140; this.vy = 0;
    this.angle = 0;
    this.radius = 20;
    this.health = 3;
    this.cycle = 0;
    this.phased = false;
    this.hull = hexPoints(this.radius);
  }
  update(dt) {
    bouncePhysics(this, dt, this.radius);
    this.cycle += dt;
    const SOLID = 1.5, PHASE = 0.8;
    this.phased = (this.cycle % (SOLID + PHASE)) >= SOLID;
  }
  render() {
    const pts = worldHull(this.hull, this.x, this.y, this.angle);
    if (this.phased) {
      const flicker = 0.15 + Math.random() * 0.25;
      strokePaths([{ points: pts, closed: true }], {
        color: AMBER, lineWidth: 2, alpha: flicker,
      });
    } else {
      strokePaths([{ points: pts, closed: true }], {
        color: AMBER, lineWidth: 2, glowBlur: 6, glowColor: AMBER,
      });
      drawText(String(this.health), this.x, this.y, { font: HEALTH_FONT, color: '#ffffff' });
    }
  }
}

// ── #5 "Shielded" ────────────────────────────────────────────────────────────
// An outer hexagonal shield ring (independent slow rotation) absorbs
// `shieldHits` before the inner core can take damage. Click/tap the shape to
// fire a test hit — the shield flashes and depletes first, then falls away
// and the core behaves like a normal Bouncer.
class ShieldedPreview {
  constructor() {
    this.x = VW / 2; this.y = 250;
    this.vx = -120; this.vy = 0;
    this.angle = 0; this.shieldAngle = 0;
    this.radius = 20; this.shieldRadius = 32;
    this.health = 3; this.shieldHits = 2;
    this.flash = 0; this.shieldFlash = 0;
    this.hull = hexPoints(this.radius);
    this.shieldHull = hexPoints(this.shieldRadius);
  }
  get activeRadius() { return this.shieldHits > 0 ? this.shieldRadius : this.radius; }
  update(dt) {
    bouncePhysics(this, dt, this.activeRadius);
    this.shieldAngle -= 1.2 * dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.shieldFlash > 0) this.shieldFlash -= dt;
  }
  hitTest(px, py) {
    const r = this.activeRadius;
    const dx = px - this.x, dy = py - this.y;
    return dx * dx + dy * dy <= r * r;
  }
  hit() {
    if (this.shieldHits > 0) {
      this.shieldHits--;
      this.shieldFlash = 0.12;
    } else {
      this.health = Math.max(0, this.health - 1);
      this.flash = 0.08;
    }
  }
  render() {
    if (this.shieldHits > 0) {
      const pts = worldHull(this.shieldHull, this.x, this.y, this.shieldAngle);
      const flash = this.shieldFlash > 0;
      strokePaths([{ points: pts, closed: true }], {
        color: flash ? '#ffffff' : SHIELD_COLOR, lineWidth: 2, alpha: 0.6,
        glowBlur: flash ? 14 : 6, glowColor: flash ? '#ffffff' : SHIELD_COLOR,
      });
    }
    const pts = worldHull(this.hull, this.x, this.y, this.angle);
    const flash = this.flash > 0;
    strokePaths([{ points: pts, closed: true }], {
      color: flash ? '#ffffff' : AMBER, lineWidth: 2,
      glowBlur: flash ? 14 : 6, glowColor: flash ? '#ffffff' : AMBER,
    });
    drawText(String(this.shieldHits > 0 ? this.shieldHits : this.health), this.x, this.y, {
      font: HEALTH_FONT, color: '#ffffff',
    });
  }
}

let current = '2';
let phaser   = new PhaserPreview();
let shielded = new ShieldedPreview();

window.addEventListener('keydown', (e) => {
  if (e.key === '2' || e.key === '5') {
    current = e.key;
    phaser   = new PhaserPreview();
    shielded = new ShieldedPreview();
  }
});

canvas.addEventListener('pointerdown', (e) => {
  if (current !== '5') return;
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width  * VW;
  const py = (e.clientY - rect.top)  / rect.height * VH;
  if (shielded.hitTest(px, py)) shielded.hit();
});

function drawFloor() {
  strokePaths([{ points: [[0, FLOOR_Y], [VW, FLOOR_Y]], closed: false }], {
    color: '#4DEFFF', lineWidth: 1, alpha: 0.3,
  });
}

function drawLabel() {
  const text = current === '2'
    ? 'Variety #3 candidate: PHASER  (press 2 / 5 to switch)'
    : 'Variety #3 candidate: SHIELDED — click to hit  (press 2 / 5 to switch)';
  drawText(text, VW / 2, 40, { font: LABEL_FONT, color: '#aab4d4' });
}

function render(dt) {
  clear('#05060c');
  drawFloor();
  drawLabel();

  if (current === '2') {
    phaser.update(dt);
    phaser.render();
  } else {
    shielded.update(dt);
    shielded.render();
  }

  // Player marker — move the pointer over the canvas to reposition it.
  fillStrokePaths([{ points: [[0,-10],[8,8],[0,4],[-8,8]], closed: true }], {
    x: playerX, y: playerY,
    fillColor: '#003a40', strokeColor: PLAYER_COLOR,
    lineWidth: 1.8, glowBlur: 8, glowColor: PLAYER_COLOR,
  });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
