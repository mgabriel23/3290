<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    user-scalable=no / maximum-scale=1.0: pinch-zoom is disabled deliberately.
    This is a full-screen canvas game, not a document — Renderer.resize maps
    CSS pixels to the virtual coordinate system once per resize; an
    OS-level pinch-zoom would desync that mapping without firing a resize
    event, permanently misaligning input coordinates from what's drawn.
    Same rationale as touch-action: none in css/layouts/_app.css.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#05070f" />
  <meta
    name="description"
    content="Space Shooter — a mobile-first 2D arcade space shooter. Defend your barrier through 30 waves of scouts, rocketeers, snipers, drifters and bouncers, and take down four unique bosses."
  />
  <title>Space Shooter</title>

  <!-- Open Graph / Twitter Card — link-preview metadata for the deployed
       custom domain (see CNAME). No dedicated preview image asset exists
       yet, so these describe the page via text only; add og:image once one
       is designed rather than pointing it at a placeholder. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Space Shooter" />
  <meta
    property="og:description"
    content="A mobile-first 2D arcade space shooter. Defend your barrier through 30 waves of scouts, rocketeers, snipers, drifters and bouncers, and take down four unique bosses."
  />
  <meta property="og:url" content="https://3290.itsmebryle.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Space Shooter" />
  <meta
    name="twitter:description"
    content="A mobile-first 2D arcade space shooter. Defend your barrier through 30 waves of scouts, rocketeers, snipers, drifters and bouncers, and take down four unique bosses."
  />
  <!-- No og:image yet — add one (and switch twitter:card to
       summary_large_image) once a title-card screenshot exists; link
       previews render text-only without it. -->

  <link rel="canonical" href="https://3290.itsmebryle.com/" />

  <!-- Minimal inline wireframe-ship mark, matching the game's void backdrop + neon-cyan chrome. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070f'/%3E%3Cpath d='M16 6 L24 24 L16 20 L8 24 Z' fill='none' stroke='%234DEFFF' stroke-width='2'/%3E%3C/svg%3E" />

  <!-- Audiowide: a retro-futuristic display face for in-canvas sci-fi UI text (e.g. the intro prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/main.css" />

  <!-- GoatCounter: free, privacy-friendly page-view analytics (no cookies,
       no consent banner needed). async so it never blocks rendering. -->
  <script data-goatcounter="https://3290.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <!-- Full-screen stage: defines the space the canvas scales into -->
  <div class="app" id="game-stage">
    <!-- Responsive canvas (sized by the Renderer). All UI is canvas-drawn,
         so the accessible name below is the only screen-reader-visible
         description of the page's content. -->
    <canvas class="app__canvas" id="game-canvas" role="img" aria-label="Space Shooter — a 2D arcade space shooter game"></canvas>
    <!-- All UI is canvas-drawn (score, menus, dialogs), so a screen-reader
         user gets nothing from the DOM beyond the canvas's one static label
         above. This hidden live region is the only other accessible-tree
         content in the page — main.js updates its text at coarse state
         changes (scene transitions, level number, game over) so a
         screen-reader user at least hears where they are, without
         attempting full per-frame HUD parity. -->
    <div id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
